# Key map preset "two buttons": operate everything with page forward and
# page back — for devices with only two buttons and for Bluetooth page
# turners.
#
#   short press forward   next page / next entry / increase a value
#   short press back      previous page / previous entry / decrease
#   long press forward    confirm (in a book: open the menu)
#   long press back       back

[keymap.global]
button.page-forward = core.next
button.page-back = core.previous
long.page-forward = core.confirm
long.page-back = core.back
