# Key map preset "left-handed": the side of the page under the thumb of
# the left hand turns forward.
#
#   tap on the left     next page
#   tap on the right    previous page

[keymap.global]
tap.top-left = core.next-page
tap.left = core.next-page
tap.bottom-left = core.next-page
tap.top-right = core.prev-page
tap.right = core.prev-page
tap.bottom-right = core.prev-page
