name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  embedded:
    name: no_std targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [riscv32imc-unknown-none-elf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel and first-party plugins
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p quireink-core -p quireink-plugin-diagnostics

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugins depend on the SDK only
        run: |
          status=0
          for manifest in plugins/*/Cargo.toml; do
            if grep -Eq '^quireink-core' "$manifest"; then
              echo "::error file=$manifest::plugins must depend on quireink-sdk, not quireink-core"
              status=1
            fi
          done
          exit $status

  emulator:
    name: Emulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quireink-emulator
      - name: Headless smoke test on every profile
        shell: bash
        run: |
          for profile in $(cargo run -q -p quireink-emulator -- --list-profiles | cut -d' ' -f1); do
            cargo run -q -p quireink-emulator -- --headless --profile "$profile" \
              --script "page-forward,wait:600" --screenshot "out/$profile.png"
          done
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: emulator-screenshots
          path: out/*.png

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
