name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # Builds without runtime font rendering use bitmap font packs.
      - run: cargo test -p quireink-text -p quireink-plugin-fonts-default --no-default-features

  embedded:
    name: no_std targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [riscv32imc-unknown-none-elf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel and first-party plugins
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p quireink-core -p quireink-plugin-diagnostics
          -p quireink-plugin-format-txt -p quireink-plugin-format-epub -p quireink-plugin-hyphenation
          -p quireink-image -p quireink-plugin-settings
          -p quireink-plugin-reader -p quireink-plugin-files
          -p quireink-plugin-menu -p quireink-plugin-menu-editor -p quireink-plugin-kosync -p quireink-plugin-keyboard -p quireink-plugin-home -p quireink-plugin-plugin-manager
          -p quireink-stardict -p quireink-plugin-dictionary
          -p quireink-plugin-fonts-default --no-default-features

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugins depend on the SDK only
        run: |
          status=0
          for manifest in plugins/*/Cargo.toml; do
            if grep -Eq '^quireink-core' "$manifest"; then
              echo "::error file=$manifest::plugins must depend on quireink-sdk, not quireink-core"
              status=1
            fi
          done
          exit $status

  emulator:
    name: Emulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quireink-emulator
      - name: Headless smoke test on every profile
        shell: bash
        run: |
          emu="cargo run -q -p quireink-emulator --"
          for profile in $($emu --list-profiles | cut -d' ' -f1); do
            $emu --headless --profile "$profile" --script "wait:600" --screenshot "out/$profile.png"
          done
          # Open a sample book from the library and read a few pages.
          $emu --headless --profile xteink-x4 \
            --script "confirm,right,confirm,page-forward,page-forward,page-back,wait:2000" \
            --screenshot out/xteink-x4-reading.png
          # An EPUB within the X4 heap budget: contents, jump to chapter II.
          $emu --headless --profile xteink-x4 \
            --set reader.open-last=off --set slots.core.home=files.browser \
            --script "confirm,wait:500,confirm,confirm,right,right,right,right,confirm,wait:300" \
            --screenshot out/xteink-x4-epub-chapter.png
          $emu --headless --profile kobo-clara-bw --set core.language=de \
            --script "tap:500:480,tap:500:190,swipe:900:700:100:700,tap:100:700,long-tap:500:700" \
            --screenshot out/kobo-clara-bw-reading.png
          # Reader menu (long confirm), larger text, settings screen.
          $emu --headless --profile xteink-x4 --script "long:confirm,confirm,wait:300" \
            --screenshot out/xteink-x4-larger-text.png
          $emu --headless --profile xteink-x4 \
            --script "long:confirm,right,right,right,right,right,confirm,right,confirm" \
            --screenshot out/xteink-x4-settings.png
          # Only two buttons: open a book, the menu and the settings, edit a value.
          $emu --headless --profile two-buttons \
            --script "long:page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward,page-forward,page-forward,page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward" \
            --screenshot out/two-buttons-settings.png
          $emu --headless --profile boox-go-7 --set slots.core.home=diagnostics.screen \
            --script "page-forward,long-tap:600:800"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: emulator-screenshots
          path: out/*.png

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      # The runner's variables are not in the `env` context, so the NDK
      # path is passed on through GITHUB_ENV.
      - name: Find the NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - name: Lint the Android shell
        run: cargo ndk -t arm64-v8a --platform 26 clippy -p quireink-android
      - name: Build the APK
        run: shells/android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quireink-android-apk
          path: target/android/quireink.apk

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: One minute per target, seeded with the sample books
        run: |
          mkdir -p fuzz/corpus/epub fuzz/corpus/txt
          cp samples/library/books/*.epub fuzz/corpus/epub/
          cp samples/library/books/*.txt fuzz/corpus/txt/
          mkdir -p fuzz/corpus/image
          cp crates/quireink-image/tests/data/*.jpg crates/quireink-image/tests/data/*.png fuzz/corpus/image/
          # `+nightly` overrides rust-toolchain.toml, which pins stable.
          for target in epub txt xml hyphen image; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=1024
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
