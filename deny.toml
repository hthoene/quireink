# cargo-deny configuration: license compliance and supply-chain checks.
# See docs/adr/0002-apache-2-license.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licenses compatible with distributing QuireInk under Apache-2.0.
# Copyleft licenses are deliberately absent.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Fonts only (plugins/fonts-default): the SIL Open Font License permits
    # bundling fonts with software under any license.
    "OFL-1.1",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
