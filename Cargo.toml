quireink-sqlite = { path = "crates/quireink-sqlite", version = "0.1.1" }
quireink-serve = { path = "crates/quireink-serve", version = "0.1.1" }
quireink-i18n = { path = "crates/quireink-i18n", version = "0.1.1" }
quireink-graphics = { path = "crates/quireink-graphics", version = "0.1.1" }
quireink-text = { path = "crates/quireink-text", version = "0.1.1" }
quireink-document = { path = "crates/quireink-document", version = "0.1.1" }
quireink-zip = { path = "crates/quireink-zip", version = "0.1.1" }
quireink-xml = { path = "crates/quireink-xml", version = "0.1.1" }
quireink-stardict = { path = "crates/quireink-stardict", version = "0.1.1" }
quireink-layout = { path = "crates/quireink-layout", version = "0.1.1" }
quireink-x4 = { path = "crates/quireink-x4", version = "0.1.1" }
quireink-fat = { path = "crates/quireink-fat" }
quireink-sdk = { path = "crates/quireink-sdk", version = "0.1.1" }
quireink-core = { path = "crates/quireink-core", version = "0.1.1" }
quireink-hyphen = { path = "crates/quireink-hyphen", version = "0.1.1" }
quireink-image = { path = "crates/quireink-image", version = "0.1.1" }
quireink-app = { path = "crates/quireink-app", version = "0.1.1" }
quireink-fs = { path = "crates/quireink-fs", version = "0.1.1" }
quireink-plugin-diagnostics = { path = "plugins/diagnostics", version = "0.1.1" }
quireink-plugin-dictionary = { path = "plugins/dictionary", version = "0.1.1" }
quireink-plugin-menu = { path = "plugins/menu", version = "0.1.1" }
quireink-plugin-menu-editor = { path = "plugins/menu-editor", version = "0.1.1" }
quireink-plugin-kosync = { path = "plugins/kosync", version = "0.1.1" }
quireink-plugin-stats = { path = "plugins/stats", version = "0.1.1" }
quireink-plugin-file-manager = { path = "plugins/file-manager", version = "0.1.1" }
quireink-plugin-transfer = { path = "plugins/transfer", version = "0.1.1" }
quireink-plugin-browser = { path = "plugins/browser", version = "0.1.1" }
quireink-plugin-opds = { path = "plugins/opds", version = "0.1.1" }
quireink-plugin-rules = { path = "plugins/rules", version = "0.1.1" }
quireink-plugin-profiles = { path = "plugins/profiles", version = "0.1.1" }
quireink-plugin-keys = { path = "plugins/keys", version = "0.1.1" }
quireink-plugin-wikipedia = { path = "plugins/wikipedia", version = "0.1.1" }
quireink-plugin-aids = { path = "plugins/aids", version = "0.1.1" }
quireink-plugin-vocabulary = { path = "plugins/vocabulary", version = "0.1.1" }
quireink-plugin-sleep = { path = "plugins/sleep", version = "0.1.1" }
quireink-plugin-translate = { path = "plugins/translate", version = "0.1.1" }
quireink-plugin-readwise = { path = "plugins/readwise", version = "0.1.1" }
quireink-plugin-wallabag = { path = "plugins/wallabag", version = "0.1.1" }
quireink-plugin-about = { path = "plugins/about", version = "0.1.1" }
quireink-plugin-news = { path = "plugins/news", version = "0.1.1" }
quireink-plugin-keyboard = { path = "plugins/keyboard", version = "0.1.1" }
quireink-plugin-plugin-manager = { path = "plugins/plugin-manager", version = "0.1.1" }
quireink-plugin-hyphenation = { path = "plugins/hyphenation", version = "0.1.1" }
quireink-plugin-home = { path = "plugins/home", version = "0.1.1" }
