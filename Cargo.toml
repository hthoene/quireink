[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Core crates run on devices with a few hundred KB of RAM: make hidden
# allocations and panics visible in review.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
# Keep debug builds usable on slow machines and in the emulator.
opt-level = 1

# Build scripts rasterize fonts; optimize them even in debug builds.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# A dependency's macro wrote its code in a random order, so the Android app
# came out different in every build; this copy hashes with fixed keys
# (patches/jni-macros, "Modified for QuireInk"), for reproducible builds.
[patch.crates-io]
jni-macros = { path = "patches/jni-macros" }
