[workspace]
resolver = "3"
# Fuzz targets build with nightly Rust and libFuzzer on their own, the X4's
# firmware for its chip only, patched dependencies (see [patch.crates-io]).
exclude = ["fuzz", "shells/xteink", "patches"]
members = [
    "crates/quireink-platform",
    "crates/quireink-config",
    "crates/quireink-sqlite",
    "crates/quireink-serve",
    "crates/quireink-i18n",
    "crates/quireink-graphics",
    "crates/quireink-text",
    "crates/quireink-document",
    "crates/quireink-layout",
    "crates/quireink-hyphen",
    "crates/quireink-image",
    "crates/quireink-zip",
    "crates/quireink-xml",
    "crates/quireink-stardict",
    "crates/quireink-sdk",
    "crates/quireink-core",
    "crates/quireink-app",
    "crates/quireink-fs",
    "crates/quireink-x4",
    "crates/quireink-fat",
    "plugins/diagnostics",
    "plugins/dictionary",
    "plugins/fonts-default",
    "plugins/format-txt",
    "plugins/format-epub",
    "plugins/format-xtc",
    "plugins/reader",
    "plugins/files",
    "plugins/menu",
    "plugins/menu-editor",
    "plugins/kosync",
    "plugins/stats",
    "plugins/file-manager",
    "plugins/transfer",
    "plugins/browser",
    "plugins/opds",
    "plugins/rules",
    "plugins/profiles",
    "plugins/keys",
    "plugins/wikipedia",
    "plugins/aids",
    "plugins/vocabulary",
    "plugins/sleep",
    "plugins/translate",
    "plugins/readwise",
    "plugins/wallabag",
    "plugins/about",
    "samples/hello-plugin",
    "plugins/news",
    "plugins/plugin-manager",
    "plugins/settings",
    "plugins/home",
    "plugins/hyphenation",
    "plugins/keyboard",
    "shells/desktop",
    "shells/android",
    "tools/fontgen",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hthoene/quireink"
homepage = "https://github.com/hthoene/quireink"
authors = ["Hannes Thoene", "The QuireInk contributors"]

