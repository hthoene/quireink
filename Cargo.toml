[workspace]
resolver = "3"
# Fuzz targets build with nightly Rust and libFuzzer on their own.
exclude = ["fuzz"]
members = [
    "crates/quireink-platform",
    "crates/quireink-config",
    "crates/quireink-i18n",
    "crates/quireink-graphics",
    "crates/quireink-text",
    "crates/quireink-document",
    "crates/quireink-layout",
    "crates/quireink-hyphen",
    "crates/quireink-image",
    "crates/quireink-zip",
    "crates/quireink-xml",
    "crates/quireink-stardict",
    "crates/quireink-sdk",
    "crates/quireink-core",
    "crates/quireink-app",
    "crates/quireink-fs",
    "plugins/diagnostics",
    "plugins/dictionary",
    "plugins/fonts-default",
    "plugins/format-txt",
    "plugins/format-epub",
    "plugins/reader",
    "plugins/files",
    "plugins/menu",
    "plugins/menu-editor",
    "plugins/plugin-manager",
    "plugins/settings",
    "plugins/home",
    "plugins/hyphenation",
    "plugins/keyboard",
    "shells/desktop",
    "shells/android",
    "tools/fontgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hthoene/quireink"
homepage = "https://github.com/hthoene/quireink"
authors = ["The QuireInk Authors"]

[workspace.dependencies]
quireink-platform = { path = "crates/quireink-platform", version = "0.1.0" }
quireink-config = { path = "crates/quireink-config", version = "0.1.0" }
quireink-i18n = { path = "crates/quireink-i18n", version = "0.1.0" }
quireink-graphics = { path = "crates/quireink-graphics", version = "0.1.0" }
quireink-text = { path = "crates/quireink-text", version = "0.1.0" }
quireink-document = { path = "crates/quireink-document", version = "0.1.0" }
quireink-zip = { path = "crates/quireink-zip", version = "0.1.0" }
quireink-xml = { path = "crates/quireink-xml", version = "0.1.0" }
quireink-stardict = { path = "crates/quireink-stardict", version = "0.1.0" }
quireink-layout = { path = "crates/quireink-layout", version = "0.1.0" }
quireink-sdk = { path = "crates/quireink-sdk", version = "0.1.0" }
quireink-core = { path = "crates/quireink-core", version = "0.1.0" }
quireink-hyphen = { path = "crates/quireink-hyphen", version = "0.1.0" }
quireink-image = { path = "crates/quireink-image", version = "0.1.0" }
quireink-app = { path = "crates/quireink-app", version = "0.1.0" }
quireink-fs = { path = "crates/quireink-fs", version = "0.1.0" }
quireink-plugin-diagnostics = { path = "plugins/diagnostics", version = "0.1.0" }
quireink-plugin-dictionary = { path = "plugins/dictionary", version = "0.1.0" }
quireink-plugin-menu = { path = "plugins/menu", version = "0.1.0" }
quireink-plugin-menu-editor = { path = "plugins/menu-editor", version = "0.1.0" }
quireink-plugin-keyboard = { path = "plugins/keyboard", version = "0.1.0" }
quireink-plugin-plugin-manager = { path = "plugins/plugin-manager", version = "0.1.0" }
quireink-plugin-hyphenation = { path = "plugins/hyphenation", version = "0.1.0" }
quireink-plugin-home = { path = "plugins/home", version = "0.1.0" }
quireink-plugin-settings = { path = "plugins/settings", version = "0.1.0" }
quireink-plugin-files = { path = "plugins/files", version = "0.1.0" }
quireink-plugin-reader = { path = "plugins/reader", version = "0.1.0" }
quireink-plugin-format-epub = { path = "plugins/format-epub", version = "0.1.0" }
quireink-plugin-format-txt = { path = "plugins/format-txt", version = "0.1.0" }
quireink-plugin-fonts-default = { path = "plugins/fonts-default", version = "0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Core crates run on devices with a few hundred KB of RAM: make hidden
# allocations and panics visible in review.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
# Keep debug builds usable on slow machines and in the emulator.
opt-level = 1

# Build scripts rasterize fonts; optimize them even in debug builds.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
